name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode (dev / release)'
        required: true
        default: 'release'
        type: choice
        options:
          - dev
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Read version from module.prop
        id: version
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          VERSION_CODE=$(grep '^versionCode=' module/module.prop | cut -d= -f2)
          ID=$(grep '^id=' module/module.prop | cut -d= -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "ID=$ID" >> "$GITHUB_OUTPUT"

      - name: Build module zip
        run: bash build.sh ${{ github.event.inputs.mode || 'release' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.ID }}-${{ steps.version.outputs.VERSION }}
          path: out/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.ID }} ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            out/*.zip
            out/*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
